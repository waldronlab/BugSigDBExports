on:
  workflow_dispatch:
    inputs:
      dryrun:
        description: "Dry run — inspect artifacts before committing"
        required: false
        default: 'true'
        type: choice
        options:
          - 'false'
          - 'true'
      version:
        description: "Specify version tag e.g. v1.3.2"
        required: true
        type: string
      news:
        description: "NEWS content (optional); \\n for line breaks, or real newlines via gh workflow run"
        required: false
        type: string

name: Release BugSigDB

jobs:
  release-bugsigdb:
    runs-on: ubuntu-latest
    container: bioconductor/bioconductor_docker:devel
    outputs:
      has_new_data: ${{ steps.check_new_data.outputs.has_new_data }}

    steps:

      - name: Checkout BugSigDBExports devel
        uses: actions/checkout@v7
        with:
          path: BugSigDBExports
          fetch-depth: 1

      - name: Checkout BugSigDBExports release branch
        uses: actions/checkout@v7
        with:
          ref: release
          path: BugSigDBExports-release
          fetch-depth: 1

      - name: Validate version format
        run: |
          cd $GITHUB_WORKSPACE/BugSigDBExports-release
          TAG="${{ github.event.inputs.version }}"
          if ! echo "$TAG" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Invalid tag format. Must be v[major].[minor].[patch] e.g. v1.3.1"
            exit 1
          fi
          if git ls-remote --tags origin "$TAG" | grep -q "$TAG"; then
            echo "Tag $TAG already exists"
            exit 1
          fi
          echo "VERSION=$TAG" >> $GITHUB_ENV

      - name: Install BugSigDBExports dependencies
        run: |
          pkgs <- c('httr2', 'rvest', 'readr', 'plyr', 'BiocFileCache', 'R.utils', 'testthat', 'stringr', 'lubridate', 'dplyr')
          BiocManager::install(pkgs)
        shell: Rscript {0}

      - name: Install bugsigdbr
        run: |
          Rscript -e "BiocManager::install('bugsigdbr')"

      - name: Test release QC
        run: |
          cd $GITHUB_WORKSPACE/BugSigDBExports
          Rscript -e 'testthat::test_dir("inst/tests", stop_on_failure = TRUE)'

      - name: Setup git config for release
        run: |
          cd $GITHUB_WORKSPACE/BugSigDBExports-release
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"

      - name: Export BugSigDB
        id: export
        run: |
          BUGSIGDB_TIMESTAMP="$(date -u +%Y-%m-%d_%H:%M_UTC)"
          echo "BUGSIGDB_TIMESTAMP=$BUGSIGDB_TIMESTAMP" >> $GITHUB_ENV
          echo $BUGSIGDB_TIMESTAMP
          Rscript $GITHUB_WORKSPACE/BugSigDBExports/inst/scripts/dump_release.R $BUGSIGDB_TIMESTAMP $GITHUB_WORKSPACE/BugSigDBExports true
          mv *csv $GITHUB_WORKSPACE/BugSigDBExports
        timeout-minutes: 10

      # NEW DATA section of NEWS: a SUMMARY computed in R from full_dump.csv
      # (its line count includes line breaks inside Description fields), then
      # the row counts of the GMT files, one signature per line
      - name: Count new rows
        run: |
          cd $GITHUB_WORKSPACE/BugSigDBExports
          RELEASE_DIR=$GITHUB_WORKSPACE/BugSigDBExports-release
          NEW_DATA=$GITHUB_WORKSPACE/new_data.txt
          Rscript inst/scripts/release_summary.R full_dump.csv $RELEASE_DIR/full_dump.csv $RELEASE_DIR/NEWS > $NEW_DATA
          for file in bugsigdb_signatures_*.gmt; do
            OLD_ROWS=$(tail -n +2 $RELEASE_DIR/$file | wc -l)
            NEW_ROWS=$(tail -n +2 $file | wc -l)
            DIFF=$((NEW_ROWS - OLD_ROWS))
            if [ $DIFF -ge 0 ]; then
              DIFF_STR="+$DIFF"
            else
              DIFF_STR="$DIFF"
            fi
            echo "    o $file: $NEW_ROWS rows ($DIFF_STR)" >> $NEW_DATA
          done
          cat $NEW_DATA

      - name: Check for new data
        id: check_new_data
        shell: bash
        run: |
          # compare contents without the header line, which has the timestamp
          if cmp -s <(tail -n +2 $GITHUB_WORKSPACE/BugSigDBExports-release/full_dump.csv) \
                    <(tail -n +2 $GITHUB_WORKSPACE/BugSigDBExports/full_dump.csv); then
            echo "No changes to full_dump.csv since last release."
            echo "has_new_data=false" >> $GITHUB_OUTPUT
          else
            echo "has_new_data=true" >> $GITHUB_OUTPUT
          fi

      - name: Copy exports to release
        if: ${{ steps.check_new_data.outputs.has_new_data == 'true' }}
        run: |
          cp $GITHUB_WORKSPACE/BugSigDBExports/full_dump.csv $GITHUB_WORKSPACE/BugSigDBExports-release/
          cp $GITHUB_WORKSPACE/BugSigDBExports/*.gmt $GITHUB_WORKSPACE/BugSigDBExports-release/

      # The news input goes through an environment variable, so that quotes,
      # parentheses, % and newlines in it reach NEWS as written
      - name: Update NEWS
        if: ${{ steps.check_new_data.outputs.has_new_data == 'true' }}
        env:
          NEWS_INPUT: ${{ github.event.inputs.news }}
        shell: bash
        run: |
          # the web form takes one line, so expand a literal \n there
          NEWS_INPUT="${NEWS_INPUT//\\n/$'\n'}"
          cd $GITHUB_WORKSPACE/BugSigDBExports-release
          {
            echo "CHANGES IN VERSION $VERSION"
            echo "------------------------"
            echo ""
            echo "NEW DATA"
            echo ""
            cat $GITHUB_WORKSPACE/new_data.txt
            if [ -n "$NEWS_INPUT" ]; then
              echo ""
              printf '%s\n' "$NEWS_INPUT"
            fi
            echo ""
            cat NEWS
          } > NEWS.tmp && mv NEWS.tmp NEWS

      - name: Stage artifacts
        if: ${{ steps.check_new_data.outputs.has_new_data == 'true' && github.event.inputs.dryrun == 'true' }}
        run: |
          mkdir -p /tmp/artifacts
          cp $GITHUB_WORKSPACE/BugSigDBExports-release/full_dump.csv /tmp/artifacts/
          cp $GITHUB_WORKSPACE/BugSigDBExports-release/bugsigdb_signatures_*.gmt /tmp/artifacts/
          cp $GITHUB_WORKSPACE/BugSigDBExports-release/NEWS /tmp/artifacts/
          ls /tmp/artifacts/

      # dropped.md lists the data that release QC removed, for a human to
      # check and post as a meta-issue on waldronlab/BugSigDBcuration.
      # Uploaded by the commit run too, since it re-exports from bugsigdb.org.
      - name: Upload release QC report
        if: ${{ steps.check_new_data.outputs.has_new_data == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: release-qc-${{ github.event.inputs.dryrun == 'true' && 'dryrun' || 'release' }}
          path: BugSigDBExports/release_qc/
          if-no-files-found: error
          retention-days: 90

      - name: Upload release candidate artifacts
        if: ${{ steps.check_new_data.outputs.has_new_data == 'true' && github.event.inputs.dryrun == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: candidate
          path: /tmp/artifacts/
          retention-days: 90

      - name: Post run summary
        if: ${{ steps.check_new_data.outputs.has_new_data == 'true' && github.event.inputs.dryrun == 'true' }}
        run: |
          echo "## Release candidate ${{ github.event.inputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "* Artifacts are available for download on this run's page." >> $GITHUB_STEP_SUMMARY
          echo "* If the data looks good, trigger the workflow again with \`dryrun\` set to \`false\` and the same tag \`${{ github.event.inputs.version }}\`." >> $GITHUB_STEP_SUMMARY
          echo "* Add content to NEWS with \`news\`." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat $GITHUB_WORKSPACE/new_data.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          QC_DIR="$GITHUB_WORKSPACE/BugSigDBExports/release_qc"
          if [ -f "$QC_DIR/dropped.md" ]; then
            # dropped.md first: the glob sorts dropped-2.md before it
            cat "$QC_DIR/dropped.md" >> $GITHUB_STEP_SUMMARY
            for f in "$QC_DIR"/dropped-*.md; do
              [ -f "$f" ] && cat "$f" >> $GITHUB_STEP_SUMMARY
            done
          else
            echo "No release QC report was written." >> $GITHUB_STEP_SUMMARY
          fi

      - name: Commit Exports
        id: commit_exports
        if: ${{ steps.check_new_data.outputs.has_new_data == 'true' && github.event.inputs.dryrun == 'false' }}
        run: |
          cd $GITHUB_WORKSPACE/BugSigDBExports-release
          for export in `find . -type f -iname \*.gmt -o -iname \*.csv -o -iname NEWS`
          do
            export=$(echo $export | sed 's/\.\///g')
            git_diff=$(git diff --numstat $export | sed -e 's/\t//g')
            if [ "$git_diff" = "11$export" -o "$git_diff" = "" ]; then
                echo "No changes to commit for $export"
            else
                echo "Add changes for $export"
                git add $export
            fi
          done
          echo "Check if any file contents have added to the index"
          has_updates=$(git diff --cached --shortstat)
          if [ -n "$has_updates" ]; then
            git commit -m "Release ${{ github.event.inputs.version }}"
            git push -u origin HEAD
            echo "pushed=true" >> $GITHUB_OUTPUT
          else
            echo "No content changes to commit"
            echo "pushed=false" >> $GITHUB_OUTPUT
          fi

      - name: Tag release
        if: ${{ steps.check_new_data.outputs.has_new_data == 'true' && github.event.inputs.dryrun == 'false' }}
        run: |
          cd $GITHUB_WORKSPACE/BugSigDBExports-release
          git tag ${{ github.event.inputs.version }}
          git push origin ${{ github.event.inputs.version }}

      - name: Create GitHub Release
        if: ${{ steps.check_new_data.outputs.has_new_data == 'true' && github.event.inputs.dryrun == 'false' }}
        run: |
          NEWS_BODY=$(sed -n "/^CHANGES IN VERSION ${{ github.event.inputs.version }}/,/^CHANGES IN VERSION/{ /^CHANGES IN VERSION ${{ github.event.inputs.version }}/d; /^CHANGES IN VERSION/d; p }" $GITHUB_WORKSPACE/BugSigDBExports-release/NEWS)
          RELEASE_ID=$(curl -X POST \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/${{ github.repository }}/releases \
            -d "{
              \"tag_name\": \"${{ github.event.inputs.version }}\",
              \"name\": \"${{ github.event.inputs.version }}\",
              \"body\": $(echo "$NEWS_BODY" | python3 -c 'import json,sys; print(json.dumps(sys.stdin.read()))'),
              \"draft\": true,
              \"prerelease\": false
            }" | python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])')
          echo "RELEASE_ID=$RELEASE_ID" >> $GITHUB_ENV

      - name: Publish GitHub Release
        if: ${{ steps.check_new_data.outputs.has_new_data == 'true' && github.event.inputs.dryrun == 'false' }}
        run: |
          curl -X PATCH \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/${{ github.repository }}/releases/${{ env.RELEASE_ID }} \
            -d '{"draft": false}'

  # Publish the release on Zenodo with individual files, which
  # bugsigdbr::importBugSigDB() reads; the Zenodo GitHub integration only
  # archives a zip of the repository (#31)
  zenodo:
    needs: release-bugsigdb
    if: ${{ needs.release-bugsigdb.outputs.has_new_data == 'true' && github.event.inputs.dryrun == 'false' }}
    uses: ./.github/workflows/zenodo-bugsigdb.yml
    with:
      version: ${{ github.event.inputs.version }}  # publish defaults to 'true'
    secrets:
      ZENODO_TOKEN: ${{ secrets.ZENODO_TOKEN }}
